# WeatherTelegramAlerts sample configuration
# Copy this file to config.yaml for local testing, or use a separate private config
# with the installer. Do not commit config.yaml or any private config.

WeatherAlerts:
  PollInterval: 300
  Uppercase: false
  RequestTimeout: 10
  StateFile: "data/last_alerts.json"
  # NWS asks for a User-Agent that identifies your app and includes contact info.
  UserAgent: "WeatherTelegramAlerts/2.2.5 (https://github.com/mkarp87/WeatherTelegramAlerts)"

Alerting:
  CountyCodes:
    - NCC013 # Beaufort


  CountyLabels:
    NCC013: "Beaufort County"


  CountyChatMap:
    NCC013: "-1000000000001"


  # Optional dashboard links for county names. Use public Telegram usernames,
  # t.me links, or private invite links. Numeric Bot API chat IDs do not work
  # as user-clickable Telegram links. Leave a value blank to show plain text.
  CountyChatLinks:
    NCC013: "" # Beaufort, e.g. https://t.me/+invitecode


  GlobalBlockedEvents:
    - "Routine Weekly Test"
    - "Required Weekly Test"
    - "Required Monthly Test"
    - "Practice/Demo Warning"
    - "Administrative Message"
    - "National Audible Test"
    - "National Information Center"
    - "Child Abduction Emergency"
    - "AMBER Alert"
    - "Tsunami Warning"

  # Valid values: onset or effective
  TimeType: onset

Telegram:
  # Prefer TELEGRAM_BOT_TOKEN in the environment, or put the token in a private config.yaml.
  BotToken: "PUT_YOUR_TELEGRAM_BOT_TOKEN_HERE"
  ChatID: "-1000000000000"

Logging:
  Debug: false
  FileLogDir: "logs"

DEV:
  INJECT: false
  PrefixMessage: "THIS IS A TEST OF THE WEATHER ALERT SYSTEM. "
  InjectChatIDs: []
  INJECTALERTS:
    - Code: NCC147
      Title: "Test Weather Alert"
      Description: "This is a test alert for dashboard and Telegram validation."

SkyDescribe:
  MaxWords: 300

Webapp:
  Host: "0.0.0.0"
  Port: 8085
  # Unified mode writes dashboard logs directly to SQLite.
  DirectLog: true
  # LogEndpoint is only needed if DirectLog is false or an external app posts logs.
  LogEndpoint: ""
  RequireWebhookToken: true
  Waitress: true
  WebhookToken: "CHANGE-ME-TO-A-LONG-RANDOM-SECRET"
  CacheSeconds: 90
  LogoURL: ""
  LogoAlt: "NC4ES Weather Alerts"

  Radar:
    Enabled: true
    Title: "Eastern North Carolina Radar"
    # Default radar mode uses the NCEP/NOAA WMS layer used for MRMS CONUS base reflectivity.
    # This is generally more reliable in Leaflet than the ArcGIS dynamic export endpoint.
    Mode: "wms"
    Height: 620
    Opacity: 0.85
    RefreshSeconds: 300
    DefaultRegion: "eastern_nc"

    WmsURL: "https://opengeo.ncep.noaa.gov/geoserver/conus/conus_bref_qcd/ows"
    WmsLayers: "conus_bref_qcd"
    WmsVersion: "1.1.1"
    WmsFormat: "image/png"
    WmsStyles: ""
    WmsTransparent: true
    WmsTiled: true
    WmsUppercase: true

    # Optional legacy ArcGIS mode. Used only when Mode: "arcgis".
    ServiceURL: "https://mapservices.weather.noaa.gov/eventdriven/rest/services/radar/radar_base_reflectivity/MapServer"
    UseDefaultLayers: true
    LayerIds: []

    DisableCache: true
    StartupDelayMs: 350
    LeafletCssURL: "https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    LeafletJsURL: "https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    EsriLeafletJsURL: "https://cdn.jsdelivr.net/npm/esri-leaflet@3.0.19/dist/esri-leaflet.js"
    BaseTileURL: "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png"
    BaseTileAttribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
    RadarAttribution: "NOAA/NWS/NCEP"
    SourceLabel: "NOAA/NCEP MRMS WMS"
    ScrollWheelZoom: false
    Regions:
      eastern_nc:
        Label: "Eastern NC"
        CenterLat: 35.35
        CenterLon: -77.25
        Zoom: 7
      northern_coast:
        Label: "Northern NC Coast"
        CenterLat: 35.90
        CenterLon: -76.05
        Zoom: 8

  LogDatabase: "data/alert_logs.sqlite3"
  LogHours: 24
  LogRetentionDays: 7
