[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "weathertelegramalerts"
version = "2.2.5"
description = "NWS weather alerts routed to Telegram with a Flask dashboard."
requires-python = ">=3.9"
dependencies = [
  "Flask>=3.0,<4",
  "requests>=2.32,<3",
  "ruamel.yaml>=0.18,<0.19",
  "python-dateutil>=2.9,<3",
  "waitress>=3.0,<4",
  "Werkzeug>=3.0,<4",
]

[project.scripts]
weather-alerts = "weather_alerts.unified:cli"
weather-alerts-poller = "weather_alerts.poller:cli"
weather-alerts-web = "weather_alerts.web:cli"

[tool.setuptools]
packages = ["weather_alerts"]
include-package-data = false
